<!doctype html>
<html lang="en" data-theme="scifi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" />
    <title>James O’Sullivan</title>
    <script>
      // Apply the remembered theme before first paint. The key matches
      // THEME_STORAGE_KEY in src/theme/themes.ts; an unknown value falls back
      // to the sci-fi tokens on :root, and ThemeProvider corrects it.
      try {
        var theme = localStorage.getItem('theme')
        if (theme) document.documentElement.dataset.theme = theme
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
