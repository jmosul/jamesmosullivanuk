version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Official Node.js 26 Linux binaries require libatomic.
        - rpm -q --quiet libatomic || sudo dnf install -y libatomic
        - nvm install
        - npm ci --include=dev
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
